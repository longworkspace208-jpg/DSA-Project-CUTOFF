# Configuration for Java Sorting Cutoff Experiment

random_seeds:
  - 42
  - 1337
  - 2026
  - 31415
  - 27182

array_sizes:
  - 1000       # 1e3
  - 10000      # 1e4
  - 100000     # 1e5
  - 1000000    # 1e6
  - 10000000   # 1e7

distributions:
  mergesort:
    - random
    - sorted
    - reversed
    - nearly_sorted
    - many_duplicates
  quicksort:
    - random
    - many_duplicates

distribution_params:
  nearly_sorted_swap_ratio: 0.01      # ~1% elements randomly perturbed
  many_duplicates_unique_count: 100  # ~100 distinct unique values

cutoffs:
  - 1
  - 2
  - 4
  - 6
  - 7
  - 8
  - 10
  - 12
  - 16
  - 20
  - 24
  - 32
  - 48
  - 64

data_dir: "data"
results_dir: "results"
manifest_path: "data/MANIFEST.csv"

# Configuration for Java Sorting Cutoff Experiment

random_seeds:
  - 42
  - 1337
  - 2026

array_sizes:
  - 10000      # 1e4
  - 100000     # 1e5
  - 500000     # 5e5
  - 1000000    # 1e6
  - 5000000    # 5e6

distributions:
  mergesort:
    - random
    - sorted
    - reversed
    - nearly_sorted
    - many_duplicates
  quicksort:
    - random
    - many_duplicates

distribution_params:
  nearly_sorted_swap_ratio: 0.01      # ~1% elements randomly perturbed
  many_duplicates_unique_count: 100  # ~100 distinct unique values

cutoffs:
  - 0
  - 4
  - 6
  - 7
  - 8
  - 10
  - 12
  - 16
  - 24
  - 32

benchmark:
  jvm_flags: "-Xms4g -Xmx4g -XX:+AlwaysPreTouch -XX:+UseParallelGC"
  jvm_version: "Oracle Corporation 25.0.2"
  adaptive_settings:
    10000:
      rounds: 1
      warmup_iterations: 1
      measurement_iterations: 4
    100000:
      rounds: 1
      warmup_iterations: 1
      measurement_iterations: 4
    500000:
      rounds: 1
      warmup_iterations: 1
      measurement_iterations: 4
    1000000:
      rounds: 1
      warmup_iterations: 1
      measurement_iterations: 4
    5000000:
      rounds: 1
      warmup_iterations: 1
      measurement_iterations: 2

data_dir: "data"
results_dir: "results"
manifest_path: "data/MANIFEST.csv"
bench_csv_path: "results/raw.csv"
